name: Cybertron checks

# Temporary checks for PRs into cybertron-integration (our team fork).
# Same code checks as zedu-hng: Prettier, ESLint, TypeScript, build, and the PR Review Bot
# (hardcoded URLs, secrets, structure, imports). Plus the PR rules zedu-hng has switched off for team PRs
# (branch name, single author, size ~400 lines), protected files, ticket matching and leftover console.log.
# Left out on purpose: lead approval, PR template. Delete this file before the final PR to zedu-hng dev.

on:
  pull_request:
    branches:
      - cybertron-integration
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
      - labeled
      - unlabeled

concurrency:
  group: cybertron-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Prettier, ESLint, TypeScript, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare TypeScript environment
        run: |
          printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      - name: Prettier (check-format)
        run: pnpm run check-format

      - name: ESLint (check-lint)
        run: pnpm run check-lint

      - name: TypeScript (check-types)
        run: pnpm run check-types

      - name: Build
        run: pnpm run build

  review-bot:
    name: Structure, reuse, URLs, and secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PR review
        run: |
          node .github/scripts/pr-review/run.mjs \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --config .github/pr-review.config.json \
            --output review-report.json

      - name: Show the report
        if: always()
        run: cat review-report.md || true

  pr-rules:
    name: Branch, title, single author, size, protected files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      TITLE: ${{ github.event.pull_request.title }}
      BODY: ${{ github.event.pull_request.body }}
      LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
      SIZE_LIMIT: "400"
      SIZE_EXCLUDE: '(^|/)(pnpm-lock\.yaml|package-lock\.json|yarn\.lock)$|\.tsbuildinfo$'
      PROTECTED: '^(\.github/|AGENTS\.md$|CONTRIBUTING\.md$|components\.json$|eslint\.config\.mjs$|\.prettierrc$|\.prettierignore$|tsconfig\.json$|next\.config\.mjs$|postcss\.config\.|tailwind\.config\.|commitlint\.config|\.gitleaks\.toml$|\.semgrepignore$|\.husky/|\.npmrc$)'
    steps:
      - name: Check the rules
        run: |
          set -o pipefail
          failed=0
          fail() { echo "::error::$1"; failed=1; }
          labels=",${LABELS},"
          has() { case "$labels" in *,"$1",*) return 0 ;; esac; return 1; }

          types='feat|fix|hotfix|test|docs|refactor|chore|perf|security'

          # Branch name: <type>/<ticket-id>-<short-description>
          branch_re="^($types)/([A-Za-z]+-)?[0-9]+-[a-z0-9][a-z0-9-]*\$"
          if [[ "$HEAD_REF" =~ $branch_re ]]; then
            echo "Branch name OK: $HEAD_REF"
          else
            fail "Branch '$HEAD_REF' must look like <type>/<ticket-id>-<short-description>, for example fix/245-login-redirect (lowercase words, hyphens)."
          fi

          # PR title: <type>(<ticket-id>): <summary>, matching the branch
          title_re="^($types)\(([A-Za-z]+-)?([0-9]+)\):[[:space:]]+.+\$"
          if [[ "$TITLE" =~ $title_re ]]; then
            ttype="${BASH_REMATCH[1]}"
            tnum="${BASH_REMATCH[3]}"
            bnum=$(printf '%s' "$HEAD_REF" | grep -oE '[0-9]+' | head -1 || true)
            btype="${HEAD_REF%%/*}"
            case "$btype" in
              feat|fix|test|docs|refactor|chore|perf)
                [ "$ttype" = "$btype" ] || fail "PR title type '$ttype' does not match the branch type '$btype'." ;;
            esac
            if [ -n "$bnum" ] && [ "$bnum" != "$tnum" ]; then
              fail "Ticket in the title ($tnum) does not match the ticket in the branch ($bnum)."
            fi
            if ! printf '%s' "$BODY" | grep -Eq "(^|[^0-9])$tnum([^0-9]|\$)"; then
              fail "Ticket $tnum is not written in the PR description (Ticket section)."
            fi
          else
            fail "PR title must look like fix(CYBERTRON-321): lowercase summary. Got: $TITLE"
          fi

          # Single author: one person per PR (bot commits and Co-authored-by trailers do not count)
          if raw=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" --jq '.[] | (.author.login // .commit.author.email)'); then
            bot='^[0-9]*\+?(dependabot|github-actions|renovate|codecov)\[bot\](@users\.noreply\.github\.com)?$'
            authors=$(printf '%s\n' "$raw" | grep -vE "$bot" | sort -u)
            count=$(grep -c . <<< "$authors" || true)
            echo "Commit authors: $(tr '\n' ' ' <<< "$authors")"
            if [ "$count" -gt 1 ]; then
              fail "This PR has commits from $count authors. One person per PR; credit others with Co-authored-by."
            fi
          else
            fail "Could not read the PR's commits (API error). Re-run this job."
          fi

          # Size and protected files share one file list: "<changed lines>\t<status>\t<path>"
          if files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
              --jq '.[] | "\(.additions + .deletions)\t\(.status)\t\(.filename)", (select(.status == "renamed") | "0\tprevious\t\(.previous_filename)")'); then
            if has hotfix; then
              echo "Hotfix label: size check skipped."
            elif has size-override; then
              echo "size-override label: size check skipped."
            else
              n=$(awk -F'\t' '$2 != "previous" && $3 !~ ENVIRON["SIZE_EXCLUDE"] { s += $1 } END { print s + 0 }' <<< "$files")
              echo "Changed lines (lockfiles and tsbuildinfo excluded): $n (limit about $SIZE_LIMIT)"
              if [ "$n" -gt "$SIZE_LIMIT" ]; then
                fail "This PR changes $n lines, over the about-$SIZE_LIMIT limit. Split it, or add the size-override label."
              fi
            fi

            secret='(^|/)\.env|\.(keystore|jks|p[[:digit:]]+|pfx|pem|mobileprovision)$|(^|/)(credentials|secrets|service-account[^/]*)\.json$'
            hits=$( {
              cut -f3 <<< "$files" | grep -E "$PROTECTED" || true
              awk -F'\t' '$2 != "removed" { print $3 }' <<< "$files" | grep -Ei "$secret" | grep -Ev '(^|/)\.env\.example$' || true
            } | grep . | sort -u || true)
            if [ -n "$hits" ]; then
              if has config-change-approved; then
                echo "::notice::Protected files changed, approved by the config-change-approved label."
              else
                fail "This PR changes protected files (add the config-change-approved label if intended): $(paste -sd' ' - <<< "$hits")"
              fi
            fi
          else
            fail "Could not read the PR's files (API error). Re-run this job."
          fi

          exit $failed

  console-log:
    name: Leftover console.log
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leftover console.log
        run: |
          git diff -U0 "origin/${{ github.base_ref }}...HEAD" -- 'src/**/*.ts' 'src/**/*.tsx' 'src/**/*.js' 'src/**/*.jsx' \
            | grep -E '^\+' | grep -vE '^\+\+\+' | grep -E 'console\.(log|debug)\(' > /tmp/console-lines.txt || true
          if [ -s /tmp/console-lines.txt ]; then
            echo "::error::Leftover console.log/debug added in this PR:"
            cat /tmp/console-lines.txt
            exit 1
          fi
